<!DOCTYPE html>
<html lang="da">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <title>QR-scanner</title>
  <meta name="description" content="Scan og opret QR-koder.">
  <!-- PWA: installerbar app -->
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
  <!-- iOS læser ikke ikoner fra manifestet, men bruger apple-touch-icon -->
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="QR-scanner">
  <!-- Kamerabilledet går helt op under statuslinjen; safe-area-insets holder knapperne fri -->
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <style>
    :root {
      --bg: #000;
      --fg: #fff;
      --fg-2: rgba(255, 255, 255, 0.64);
      --fg-3: rgba(255, 255, 255, 0.42);
      --accent: #10B981;
      /* Hvid tekst på #10B981 har kun kontrast 2,5:1 — derfor mørk tekst på grønne knapper (≈8:1) */
      --on-accent: #03140e;
      --error: #EF4444;
      --glass: rgba(30, 30, 32, 0.55);
      --glass-strong: rgba(24, 24, 26, 0.92);
      --hairline: rgba(255, 255, 255, 0.1);
      --dim: rgba(0, 0, 0, 0.6);
      --ease-out: cubic-bezier(0.22, 1, 0.36, 1);
      --t: 260ms;
      --frame-size: min(70vw, 58vh, 420px);
      --frame-radius: 22px;
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      background: var(--bg);
      color: var(--fg);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Inter", "Segoe UI", Roboto, system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    button { font: inherit; color: inherit; }
    svg.icon { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: none; }

    /* Frosted glass: -webkit- prefiks kræves af iOS Safari før version 18 */
    .glass {
      background: var(--glass);
      -webkit-backdrop-filter: blur(20px) saturate(160%);
      backdrop-filter: blur(20px) saturate(160%);
    }

    /* --- Kamera i fuld skærm --- */
    #video {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: 0;
      transition: opacity 400ms var(--ease-out);
    }
    body.camera-on #video { opacity: 1; }

    /* --- Scanningsfelt: box-shadow'et dæmper alt udenfor feltet --- */
    #frame {
      position: fixed;
      width: var(--frame-size);
      height: var(--frame-size);
      left: calc(50% - var(--frame-size) / 2);
      top: calc(50% - var(--frame-size) / 2 - 3vh);
      border-radius: var(--frame-radius);
      box-shadow: 0 0 0 200vmax var(--dim);
      pointer-events: none;
      opacity: 0;
      --corner: #fff;
      transition:
        left var(--t) var(--ease-out), top var(--t) var(--ease-out),
        width var(--t) var(--ease-out), height var(--t) var(--ease-out),
        opacity 400ms var(--ease-out);
    }
    body.camera-on #frame { opacity: 1; }
    .corner {
      position: absolute;
      width: 38px;
      height: 38px;
      border: 0 solid var(--corner);
      transition: border-color var(--t) var(--ease-out);
    }
    .corner.tl { top: 0; left: 0; border-top-width: 4px; border-left-width: 4px; border-top-left-radius: var(--frame-radius); }
    .corner.tr { top: 0; right: 0; border-top-width: 4px; border-right-width: 4px; border-top-right-radius: var(--frame-radius); }
    .corner.bl { bottom: 0; left: 0; border-bottom-width: 4px; border-left-width: 4px; border-bottom-left-radius: var(--frame-radius); }
    .corner.br { bottom: 0; right: 0; border-bottom-width: 4px; border-right-width: 4px; border-bottom-right-radius: var(--frame-radius); }

    #scan-line-track {
      position: absolute;
      inset: 14px;
      overflow: hidden;
      transition: opacity var(--t) var(--ease-out);
    }
    #scan-line {
      position: absolute;
      left: 6%;
      right: 6%;
      top: 0;
      height: 2px;
      border-radius: 2px;
      background: linear-gradient(90deg, transparent, var(--accent) 20%, #a7f3d0 50%, var(--accent) 80%, transparent);
      box-shadow: 0 0 12px 2px rgba(16, 185, 129, 0.55);
      opacity: 0.85;
      animation: scan 2.6s ease-in-out infinite alternate;
    }
    @keyframes scan { from { top: 0; } to { top: calc(100% - 2px); } }

    #frame.found { --corner: var(--accent); }
    #frame.found #scan-line-track,
    #frame.error #scan-line-track { opacity: 0; }
    #frame.error { --corner: var(--error); }
    #frame.error .corner { animation: soft-blink 700ms var(--ease-out); }
    @keyframes soft-blink { 0%, 100% { opacity: 1; } 35% { opacity: 0.35; } 70% { opacity: 1; } }

    /* --- Instruktions-pille øverst --- */
    #pill {
      position: fixed;
      top: calc(var(--safe-top) + 18px);
      left: 50%;
      transform: translateX(-50%);
      max-width: calc(100% - 32px);
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 11px 18px;
      border-radius: 999px;
      font-size: 15px;
      font-weight: 500;
      letter-spacing: -0.01em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      transition: opacity 200ms var(--ease-out);
    }
    #pill.fading { opacity: 0; }
    #pill .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--error); flex: none; display: none; }
    #pill.is-error .dot { display: block; }
    body.no-camera #pill:not(.is-error),
    body.sheet-open #pill { opacity: 0; }

    /* --- Ikonknapper nederst --- */
    #controls {
      position: fixed;
      left: 0;
      right: 0;
      bottom: calc(var(--safe-bottom) + 34px);
      display: flex;
      justify-content: space-between;
      align-items: center;
      max-width: 420px;
      margin: 0 auto;
      padding: 0 40px;
      transition: opacity var(--t) var(--ease-out);
    }
    body.no-camera #controls { display: none; }
    .round-btn {
      width: 58px;
      height: 58px;
      border-radius: 50%;
      border: 1px solid var(--hairline);
      display: grid;
      place-items: center;
      cursor: pointer;
      transition: background-color var(--t) var(--ease-out), color var(--t) var(--ease-out), transform 150ms var(--ease-out), opacity var(--t) var(--ease-out);
    }
    .round-btn:active { transform: scale(0.94); }
    .round-btn.small { width: 48px; height: 48px; }
    .round-btn.unsupported { opacity: 0.4; }
    #torch-btn[aria-pressed="true"] { background: #fff; color: #000; }

    #version {
      position: fixed;
      left: 0;
      right: 0;
      bottom: calc(var(--safe-bottom) + 8px);
      text-align: center;
      font-size: 10px;
      color: var(--fg-3);
      pointer-events: none;
    }

    /* --- Bottom sheets (resultat + historik) --- */
    .sheet {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      max-width: 540px;
      margin: 0 auto;
      padding: 10px 20px calc(var(--safe-bottom) + 20px);
      border-radius: 26px 26px 0 0;
      background: var(--glass-strong);
      -webkit-backdrop-filter: blur(24px) saturate(160%);
      backdrop-filter: blur(24px) saturate(160%);
      border-top: 1px solid var(--hairline);
      box-shadow: 0 -12px 40px rgba(0, 0, 0, 0.4);
      transform: translateY(calc(100% + 20px));
      transition: transform 300ms var(--ease-out);
      z-index: 10;
    }
    .sheet.open { transform: translateY(0); }
    .grabber { width: 38px; height: 5px; border-radius: 3px; background: rgba(255, 255, 255, 0.22); margin: 0 auto 16px; }

    .overline {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 8px;
    }
    .overline svg.icon { width: 16px; height: 16px; }
    #result-title {
      margin: 0;
      font-size: 24px;
      font-weight: 650;
      letter-spacing: -0.02em;
      line-height: 1.2;
      word-break: break-word;
      white-space: pre-wrap;
      max-height: 32vh;
      overflow-y: auto;
    }
    #result-sub {
      margin-top: 6px;
      font-size: 14px;
      color: var(--fg-2);
      word-break: break-all;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    #result-sub:empty { display: none; }

    .actions { display: flex; flex-direction: column; gap: 10px; margin-top: 22px; }
    .actions-row { display: flex; gap: 10px; }
    .actions-row > * { flex: 1; }
    .btn {
      min-height: 52px;
      padding: 0 18px;
      border-radius: 16px;
      border: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font-size: 16px;
      font-weight: 600;
      letter-spacing: -0.01em;
      cursor: pointer;
      transition: background-color var(--t) var(--ease-out), transform 150ms var(--ease-out), opacity var(--t) var(--ease-out);
    }
    .btn:active { transform: scale(0.98); }
    .actions-row .btn { white-space: nowrap; padding: 0 12px; }
    .btn svg.icon { width: 20px; height: 20px; }
    .btn.primary { background: var(--accent); color: var(--on-accent); }
    .btn.secondary { background: rgba(255, 255, 255, 0.1); color: var(--fg); }
    .btn[hidden] { display: none; }

    /* Historik-sheet */
    #history-sheet { max-height: 80vh; max-height: 80dvh; display: flex; flex-direction: column; }

    /* --- Tilstandsvælger Scan / Opret (som i kamera-apps) --- */
    #mode-switch {
      position: fixed;
      left: 50%;
      bottom: calc(var(--safe-bottom) + 34px + 58px + 22px);
      transform: translateX(-50%);
      display: flex;
      padding: 4px;
      border-radius: 999px;
      border: 1px solid var(--hairline);
    }
    body.no-camera #mode-switch { display: none; }
    #mode-indicator {
      position: absolute;
      top: 4px;
      bottom: 4px;
      left: 4px;
      width: calc(50% - 4px);
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.18);
      transition: transform var(--t) var(--ease-out);
    }
    body.create-open #mode-indicator { transform: translateX(100%); }
    .mode-btn {
      position: relative;
      min-width: 84px;
      min-height: 44px;
      padding: 0 18px;
      border: none;
      border-radius: 999px;
      background: transparent;
      color: var(--fg-2);
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: color var(--t) var(--ease-out);
    }
    body:not(.create-open) #mode-scan,
    body.create-open #mode-create { color: var(--fg); }

    /* --- Opret QR-kode --- */
    #create-sheet { max-height: 92vh; max-height: 92dvh; display: flex; flex-direction: column; overflow-y: auto; }
    #create-input {
      width: 100%;
      min-height: 84px;
      max-height: 22vh;
      padding: 14px 16px;
      border-radius: 16px;
      border: 1px solid var(--hairline);
      background: rgba(255, 255, 255, 0.07);
      color: var(--fg);
      font: inherit;
      font-size: 16px;            /* mindst 16px, ellers zoomer iOS ind ved fokus */
      line-height: 1.4;
      resize: none;
      outline: none;
      transition: border-color var(--t) var(--ease-out);
    }
    #create-input::placeholder { color: var(--fg-3); }
    #create-input:focus { border-color: rgba(16, 185, 129, 0.7); }
    .create-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin: 8px 2px 0;
      font-size: 13px;
      color: var(--fg-3);
    }
    #create-kind { display: flex; align-items: center; gap: 6px; }
    #create-kind svg.icon { width: 14px; height: 14px; }
    #create-count.over { color: var(--error); }
    #qr-card {
      position: relative;
      width: min(62vw, 30vh, 260px);
      aspect-ratio: 1;
      margin: 20px auto 0;
      border-radius: 22px;
      background: #fff;
      display: grid;
      place-items: center;
      overflow: hidden;
      flex: none;
      transition: background-color var(--t) var(--ease-out);
    }
    #qr-card.empty { background: rgba(255, 255, 255, 0.06); }
    #qr-canvas {
      width: 100%;
      height: 100%;
      image-rendering: pixelated;
      opacity: 1;
      transition: opacity 200ms var(--ease-out);
    }
    #qr-card.empty #qr-canvas { opacity: 0; }
    #qr-placeholder {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 16px;
      text-align: center;
      font-size: 14px;
      color: var(--fg-3);
      opacity: 0;
      transition: opacity 200ms var(--ease-out);
    }
    #qr-placeholder svg.icon { width: 36px; height: 36px; stroke-width: 1.5; }
    #qr-card.empty #qr-placeholder { opacity: 1; }
    #qr-card.too-long #qr-placeholder { color: var(--error); }
    #create-sheet .btn:disabled { opacity: 0.35; cursor: default; }
    .sheet-header { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 12px; }
    .sheet-header h2 { margin: 0; font-size: 26px; font-weight: 700; letter-spacing: -0.02em; }
    .sheet-header .header-actions { display: flex; align-items: center; gap: 4px; }
    .text-btn {
      min-height: 44px;
      padding: 0 12px;
      border: none;
      border-radius: 12px;
      background: transparent;
      color: var(--fg-2);
      font-size: 15px;
      font-weight: 500;
      cursor: pointer;
      transition: color var(--t) var(--ease-out), background-color var(--t) var(--ease-out);
    }
    .text-btn.confirm { color: var(--error); background: rgba(239, 68, 68, 0.12); }
    .icon-btn {
      width: 44px;
      height: 44px;
      border: none;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.1);
      display: grid;
      place-items: center;
      cursor: pointer;
    }
    .icon-btn svg.icon { width: 20px; height: 20px; }
    #history-empty { color: var(--fg-2); font-size: 15px; padding: 24px 0 8px; text-align: center; }
    #history-list {
      list-style: none;
      margin: 0 -20px;
      padding: 0 20px;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }
    .history-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 0;
      border-bottom: 1px solid var(--hairline);
    }
    .history-item:last-child { border-bottom: none; }
    .history-kind {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.08);
      display: grid;
      place-items: center;
      color: var(--fg-2);
      flex: none;
    }
    .history-kind svg.icon { width: 18px; height: 18px; }
    .history-body { flex: 1; min-width: 0; }
    .history-content {
      font-size: 16px;
      word-break: break-word;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .history-content a { color: var(--accent); text-decoration: none; }
    .history-time { font-size: 13px; color: var(--fg-3); margin-top: 2px; }
    .history-delete { background: transparent; color: var(--fg-3); }
    #privacy-link {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 44px;
      margin-top: 8px;
      font-size: 13px;
      color: var(--fg-3);
      text-decoration: none;
      flex: none;
    }

    /* --- Tomt-skærmbillede (ingen kameraadgang) --- */
    #empty-state {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: calc(var(--safe-top) + 24px) 32px calc(var(--safe-bottom) + 24px);
      opacity: 0;
      pointer-events: none;
      transition: opacity 300ms var(--ease-out);
    }
    body.no-camera #empty-state { opacity: 1; pointer-events: auto; }
    .empty-icon {
      width: 88px;
      height: 88px;
      border-radius: 28px;
      background: rgba(255, 255, 255, 0.08);
      display: grid;
      place-items: center;
      margin-bottom: 28px;
    }
    .empty-icon svg.icon { width: 40px; height: 40px; stroke-width: 1.6; color: var(--fg-2); }
    #empty-state h1 { margin: 0 0 10px; font-size: 28px; font-weight: 700; letter-spacing: -0.02em; }
    #empty-text { margin: 0 0 32px; max-width: 320px; font-size: 16px; line-height: 1.45; color: var(--fg-2); }
    #empty-state .btn { width: 100%; max-width: 320px; }
    #empty-state .text-btn { margin-top: 8px; }

    /* Små telefoner (fx iPhone SE): lidt mindre tekst og luft i kortet */
    @media (max-width: 360px), (max-height: 640px) {
      #result-title { font-size: 21px; }
      .actions { margin-top: 18px; }
      .btn { min-height: 48px; font-size: 15px; }
    }

    @media (prefers-reduced-motion: reduce) {
      #scan-line { animation: none; top: 50%; }
      * { transition-duration: 0.01ms !important; animation-duration: 0.01ms !important; }
    }
  </style>
</head>
<body>
  <!-- Ikoner: Lucide (lucide.dev), ISC-licens -->

    <symbol id="i-image" viewBox="0 0 24 24"><rect width="18" height="18" x="3" y="3" rx="2" ry="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21"/></symbol>

    <symbol id="i-text" viewBox="0 0 24 24"><polyline points="4 7 4 4 20 4 20 7"/><line x1="9" x2="15" y1="20" y2="20"/><line x1="12" x2="12" y1="4" y2="20"/></symbol>
    <symbol id="i-x" viewBox="0 0 24 24"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></symbol>
    <symbol id="i-share" viewBox="0 0 24 24"><path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"/><polyline points="16 6 12 2 8 6"/><line x1="12" x2="12" y1="2" y2="15"/></symbol>

    <symbol id="i-qr" viewBox="0 0 24 24"><rect width="5" height="5" x="3" y="3" rx="1"/><rect width="5" height="5" x="16" y="3" rx="1"/><rect width="5" height="5" x="3" y="16" rx="1"/><path d="M21 16h-3a2 2 0 0 0-2 2v3"/><path d="M21 21v.01"/><path d="M12 7v3a2 2 0 0 1-2 2H7"/><path d="M3 12h.01"/><path d="M12 3h.01"/><path d="M12 16v.01"/><path d="M16 12h1"/><path d="M21 12v.01"/><path d="M12 21v-1"/></symbol>
  </svg>

  <!-- playsinline + muted: kræves af iOS Safari for at afspille inline uden fuldskærm -->
  <video id="video" autoplay playsinline muted></video>

  <div id="frame" aria-hidden="true">
    <div id="scan-line-track"><div id="scan-line"></div></div>
    <div class="corner tl"></div><div class="corner tr"></div>
    <div class="corner bl"></div><div class="corner br"></div>
  </div>

  <div id="pill" class="glass" role="status" aria-live="polite"><span class="dot"></span><span id="pill-text">Starter kamera…</span></div>

  <div id="mode-switch" class="glass" role="tablist">
    <div id="mode-indicator"></div>
    <button id="mode-scan" class="mode-btn" role="tab">Scan</button>
    <button id="mode-create" class="mode-btn" role="tab">Opret</button>
  </div>

  <div id="controls">
    <button id="torch-btn" class="round-btn glass" aria-label="Lommelygte" aria-pressed="false">
      <svg class="icon"><use href="#i-flash"/></svg>
    </button>
    <button id="history-btn" class="round-btn small glass" aria-label="Historik">
      <svg class="icon"><use href="#i-history"/></svg>
    </button>
    <button id="gallery-btn" class="round-btn glass" aria-label="Vælg billede fra galleri">
      <svg class="icon"><use href="#i-image"/></svg>
    </button>
  </div>
  <input id="file-input" type="file" accept="image/*" hidden>

  <div id="version"></div>

  <!-- Tomt-skærmbillede når kameraet ikke kan bruges -->
  <div id="empty-state">
    <div class="empty-icon"><svg class="icon"><use href="#i-camera-off"/></svg></div>
    <h1 id="empty-title">Kameraadgang</h1>
    <p id="empty-text">Giv adgang til kameraet for at scanne QR-koder. Billedet forlader aldrig din enhed.</p>
    <button id="permission-btn" class="btn primary">Giv adgang til kamera</button>
    <button id="empty-gallery-btn" class="text-btn">Vælg billede i stedet</button>
    <button id="empty-create-btn" class="text-btn">Opret en QR-kode</button>
  </div>

  <!-- Resultatkort -->
  <section id="result-sheet" class="sheet" aria-label="Resultat" inert>
    <div class="grabber"></div>
    <div class="overline"><svg class="icon"><use id="result-kind-icon" href="#i-link"/></svg><span id="result-kind">Link</span></div>
    <h2 id="result-title"></h2>
    <div id="result-sub"></div>
    <div class="actions">
      <button id="open-btn" class="btn primary"><svg class="icon"><use href="#i-external"/></svg>Åbn</button>
      <div class="actions-row">
        <button id="copy-btn" class="btn secondary"><svg class="icon"><use id="copy-icon" href="#i-copy"/></svg><span id="copy-label">Kopiér</span></button>
        <button id="rescan-btn" class="btn secondary"><svg class="icon"><use href="#i-scan"/></svg>Scan igen</button>
      </div>
    </div>
  </section>

  <!-- Historik -->
  <section id="history-sheet" class="sheet" aria-label="Historik" inert>
    <div class="grabber"></div>
    <div class="sheet-header">
      <h2>Historik</h2>
      <div class="header-actions">
        <button id="clear-history-btn" class="text-btn">Ryd</button>
        <button id="close-history-btn" class="icon-btn" aria-label="Luk"><svg class="icon"><use href="#i-x"/></svg></button>
      </div>
    </div>
    <div id="history-empty">Ingen scannede koder endnu.</div>
    <ul id="history-list"></ul>
    <a id="privacy-link" href="privacy.html">Privatlivspolitik</a>
  </section>

  <!-- Opret QR-kode -->
  <section id="create-sheet" class="sheet" aria-label="Opret QR-kode" inert>
    <div class="grabber"></div>
    <div class="sheet-header">
      <h2>Opret QR-kode</h2>
      <button id="close-create-btn" class="icon-btn" aria-label="Luk"><svg class="icon"><use href="#i-x"/></svg></button>
    </div>
    <textarea id="create-input" rows="3" placeholder="Skriv tekst eller indsæt et link" aria-label="Tekst eller link"></textarea>
    <div class="create-meta">
      <span id="create-kind"></span>
      <span id="create-count"></span>
    </div>
    <div id="qr-card" class="empty">
      <canvas id="qr-canvas" aria-label="Genereret QR-kode"></canvas>
      <div id="qr-placeholder"><svg class="icon"><use href="#i-qr"/></svg><span id="qr-placeholder-text">Din QR-kode vises her</span></div>
    </div>
    <div class="actions">
      <div class="actions-row">
        <button id="share-btn" class="btn primary" disabled><svg class="icon"><use href="#i-share"/></svg>Del</button>
        <button id="save-btn" class="btn secondary" disabled><svg class="icon"><use id="save-icon" href="#i-download"/></svg><span id="save-label">Gem billede</span></button>
      </div>
    </div>
  </section>

  <!-- jsQR 1.4.0 (Apache-2.0), lokal kopi — se lib/jsQR.LICENSE -->
  <script src="lib/jsQR.js"></script>
  <!-- qrcode-generator 2.0.4 (MIT, © Kazuhiko Arase), lokal kopi — licens i filens top -->
  <script src="lib/qrcode-generator.js"></script>
  <script>
    // Opdateres ved hver push, så man kan se om man har den nyeste version
    const APP_VERSION = 'v0.8 · privatlivspolitik';

    const $ = id => document.getElementById(id);
    const video = $('video');
    const frame = $('frame');
    const pill = $('pill');
    const pillText = $('pill-text');
    const torchBtn = $('torch-btn');
    const fileInput = $('file-input');
    const resultSheet = $('result-sheet');
    const historySheet = $('history-sheet');
    const historyList = $('history-list');
    const historyEmpty = $('history-empty');
    const clearHistoryBtn = $('clear-history-btn');

    // localStorage deles af ALLE sider på saidi3616.github.io, så nøglen får et
    // app-specifikt præfiks for ikke at kollidere med fx Koran-appen.
    const HISTORY_KEY = 'qr-scanner:history';
    const HISTORY_MAX = 100;

    // Skjult lærred som kamerabilledet tegnes på, så pixels kan gives til jsQR
    const scanCanvas = document.createElement('canvas');
    const scanCtx = scanCanvas.getContext('2d', { willReadFrequently: true });

    const SCAN_INTERVAL_MS = 150;   // højst ~6-7 scanninger i sekundet, sparer batteri
    const MAX_SCAN_SIZE = 800;      // nedskalér store billeder — hurtigere, stadig skarpt nok
    const INSTRUCTION = 'Ret kameraet mod en QR-kode';
    let lastScanTime = 0;
    let lastResult = null;
    let missCount = 0;              // antal scanninger i træk uden kode (bruges efter "Scan igen")
    let paused = false;             // scanning sat på pause mens et kort er åbent
    let scanLoopStarted = false;
    let videoTrack = null;
    let torchOn = false;
    let currentText = '';
    let deniedOnce = false;
    let lastErrorTime = 0;

    $('version').textContent = APP_VERSION;
    console.log('[QR-scanner]', APP_VERSION);

    // --- Pille / diskrete beskeder ---
    let pillTimer = null;
    function setPill(text, isError = false) {
      pill.classList.add('fading');
      setTimeout(() => {
        pillText.textContent = text;
        pill.classList.toggle('is-error', isError);
        pill.classList.remove('fading');
      }, 200);
    }
    function flashMessage(text, isError = true, ms = 2600) {
      clearTimeout(pillTimer);
      setPill(text, isError);
      pillTimer = setTimeout(() => setPill(INSTRUCTION), ms);
    }

    // Oversæt de fejl getUserMedia kan kaste til en forståelig besked
    function describeError(err) {
      switch (err.name) {
        case 'NotAllowedError':
          return 'Adgang til kameraet blev afvist. Tillad kamera i browserens indstillinger for siden og prøv igen.';
        case 'NotFoundError':
          return 'Der blev ikke fundet noget kamera på enheden.';
        case 'NotReadableError':
          return 'Kameraet kunne ikke åbnes — det bruges måske af en anden app.';
        case 'OverconstrainedError':
          return 'Kameraet understøtter ikke de ønskede indstillinger.';
        case 'SecurityError':
          return 'Kamera-adgang er blokeret af sikkerhedsindstillinger (kræver https).';
        default:
          return 'Ukendt fejl: ' + err.name + ' — ' + err.message;
      }
    }

    function showEmptyState(title, text, buttonLabel) {
      $('empty-title').textContent = title;
      $('empty-text').textContent = text;
      $('permission-btn').textContent = buttonLabel;
      document.body.classList.remove('camera-on');
      document.body.classList.add('no-camera');
    }

    async function startCamera() {
      // navigator.mediaDevices findes kun i en "secure context" (https eller localhost)
      if (!window.isSecureContext || !navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        showEmptyState('Kræver sikker forbindelse', 'Kameraet kræver at siden åbnes via https (det live link), ikke som lokal fil.', 'Prøv igen');
        return;
      }

      document.body.classList.remove('no-camera');
      setPill('Starter kamera…');

      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          audio: false,
          // "ideal" = foretræk bagkameraet, men fald tilbage til et andet kamera (fx på en PC)
          video: { facingMode: { ideal: 'environment' } }
        });

        video.srcObject = stream;
        await video.play();

        videoTrack = stream.getVideoTracks()[0];
        setupTorch();
        document.body.classList.add('camera-on');
        setPill(INSTRUCTION);
        console.log('[QR-scanner] Kamera startet', videoTrack.getSettings());

        if (!scanLoopStarted) {
          scanLoopStarted = true;
          requestAnimationFrame(scanLoop);
        }
      } catch (err) {
        console.error('[QR-scanner] Kamerafejl', err);
        if (err.name === 'NotAllowedError') {
          // Anden afvisning i træk betyder typisk at browseren har blokeret siden permanent
          showEmptyState('Kameraadgang',
            deniedOnce
              ? 'Kameraet er blokeret for denne side. Tryk på ikonet ved adresselinjen (eller Indstillinger › Safari › Kamera på iPhone), tillad kamera og prøv igen.'
              : 'Giv adgang til kameraet for at scanne QR-koder. Billedet forlader aldrig din enhed.',
            'Giv adgang til kamera');
          deniedOnce = true;
        } else {
          showEmptyState('Kameraet kunne ikke startes', describeError(err), 'Prøv igen');
        }
      }
    }

    function scanLoop(now) {
      requestAnimationFrame(scanLoop);
      if (paused) return;
      if (now - lastScanTime < SCAN_INTERVAL_MS) return;
      if (video.readyState < video.HAVE_ENOUGH_DATA || !video.videoWidth) return;
      lastScanTime = now;

      const scale = Math.min(1, MAX_SCAN_SIZE / Math.max(video.videoWidth, video.videoHeight));
      const w = Math.round(video.videoWidth * scale);
      const h = Math.round(video.videoHeight * scale);
      if (scanCanvas.width !== w || scanCanvas.height !== h) {
        scanCanvas.width = w;
        scanCanvas.height = h;
      }
      scanCtx.drawImage(video, 0, 0, w, h);
      const imageData = scanCtx.getImageData(0, 0, w, h);

      // "dontInvert": kun almindelige sorte-på-hvide koder — ifølge jsQR's README ~50% hurtigere
      const code = jsQR(imageData.data, w, h, { inversionAttempts: 'dontInvert' });

      if (!code) {
        // Efter "Scan igen" skal samme kode først ud af billedet (~0,75 s) før den tæller igen
        if (++missCount > 5) lastResult = null;
        return;
      }
      missCount = 0;
      if (!code.data) {
        // Koden blev fundet, men indholdet kunne ikke tolkes som tekst
        if (now - lastErrorTime > 3000) {
          lastErrorTime = now;
          showError('QR-koden kunne ikke læses');
        }
        return;
      }
      if (code.data === lastResult) return;
      showResult(code.data, codeRectOnScreen(code.location, w, h));
    }

    // Omregn kodens hjørner fra scan-lærredet til skærmkoordinater. Videoen vises med
    // object-fit: cover, så der skaleres og forskydes på samme måde som billedet beskæres.
    function codeRectOnScreen(loc, srcW, srcH) {
      const boxW = video.clientWidth;
      const boxH = video.clientHeight;
      const s = Math.max(boxW / srcW, boxH / srcH);
      const dx = (boxW - srcW * s) / 2;
      const dy = (boxH - srcH * s) / 2;
      const pts = [loc.topLeftCorner, loc.topRightCorner, loc.bottomRightCorner, loc.bottomLeftCorner]
        .map(p => ({ x: p.x * s + dx, y: p.y * s + dy }));
      const minX = Math.min(...pts.map(p => p.x)), maxX = Math.max(...pts.map(p => p.x));
      const minY = Math.min(...pts.map(p => p.y)), maxY = Math.max(...pts.map(p => p.y));
      const size = Math.max(140, Math.max(maxX - minX, maxY - minY) + 44);
      return { x: (minX + maxX) / 2 - size / 2, y: (minY + maxY) / 2 - size / 2, size };
    }

    // Hjørnerne glider ind om koden. Uden position (fx billede fra galleri) trækker
    // feltet sig blot lidt sammen om midten.
    function snapFrame(rect) {
      const r = frame.getBoundingClientRect();
      // Feltet må kun trække sig sammen, aldrig vokse — er koden større end feltet
      // (holdt tæt på), bliver den lidt mindre end standardfeltet om kodens midte.
      const maxSize = r.width * 0.9;
      const size = rect ? Math.min(rect.size, maxSize) : r.width * 0.86;
      let cx = rect ? rect.x + rect.size / 2 : r.left + r.width / 2;
      let cy = rect ? rect.y + rect.size / 2 : r.top + r.height / 2;
      // Hold feltet inden for skærmen
      const m = 12;
      cx = Math.min(Math.max(cx, size / 2 + m), innerWidth - size / 2 - m);
      cy = Math.min(Math.max(cy, size / 2 + m), innerHeight - size / 2 - m);
      frame.style.left = (cx - size / 2) + 'px';
      frame.style.top = (cy - size / 2) + 'px';
      frame.style.width = size + 'px';
      frame.style.height = size + 'px';
    }
    function resetFrame() {
      frame.classList.remove('found', 'error');
      frame.style.left = frame.style.top = frame.style.width = frame.style.height = '';
    }

    function showError(message) {
      frame.classList.remove('error');
      void frame.offsetWidth;          // genstart blink-animationen
      frame.classList.add('error');
      setTimeout(() => frame.classList.remove('error'), 800);
      flashMessage(message);
    }

    function showResult(text, rect) {
      lastResult = text;
      paused = true;
      clearTimeout(pillTimer);
      frame.classList.remove('error');
      frame.classList.add('found');
      snapFrame(rect);
      if (navigator.vibrate) navigator.vibrate(40);   // virker ikke i iOS Safari (ikke understøttet)
      addToHistory(text);
      openResultSheet(text);
      console.log('[QR-scanner] QR-kode afkodet:', text);
    }

    // --- Resultatkort ---
    // body.sheet-open skjuler instruktions-pillen, så længe et kort er åbent
    function syncSheetState() {
      document.body.classList.toggle('sheet-open', !!document.querySelector('.sheet.open'));
    }
    function openSheet(sheet) {
      sheet.inert = false;
      sheet.classList.add('open');
      syncSheetState();
    }
    function closeSheet(sheet) {
      sheet.classList.remove('open');
      sheet.inert = true;
      syncSheetState();
    }

    function openResultSheet(text) {
      currentText = text;
      const url = toSafeUrl(text);
      $('result-kind').textContent = url ? 'Link' : 'Tekst';
      $('result-kind-icon').setAttribute('href', url ? '#i-link' : '#i-text');
      if (url) {
        // Stor overskrift = domænet, fuld adresse nedenunder (som den stod i koden)
        $('result-title').textContent = new URL(url).hostname.replace(/^www\./, '');
        $('result-sub').textContent = text.trim();
      } else {
        $('result-title').textContent = text;
        $('result-sub').textContent = '';
      }
      $('open-btn').hidden = !url;
      // Uden link er "Scan igen" den primære handling
      $('rescan-btn').className = 'btn ' + (url ? 'secondary' : 'primary');
      resetCopyButton();
      closeSheet(historySheet);
      openSheet(resultSheet);
    }

    function rescan() {
      closeSheet(resultSheet);
      resetFrame();
      setPill(INSTRUCTION);
      missCount = 0;
      // Kort pause, så overgangen når at køre før næste scanning
      resumeIfIdle();
    }

    $('open-btn').addEventListener('click', () => {
      const url = toSafeUrl(currentText);
      if (url) window.open(url, '_blank', 'noopener,noreferrer');
    });
    $('rescan-btn').addEventListener('click', rescan);

    let copyTimer = null;
    function resetCopyButton() {
      clearTimeout(copyTimer);
      $('copy-label').textContent = 'Kopiér';
      $('copy-icon').setAttribute('href', '#i-copy');
    }
    $('copy-btn').addEventListener('click', async () => {
      try {
        await navigator.clipboard.writeText(currentText);
      } catch {
        // Reserveløsning hvis Clipboard API ikke er tilgængeligt
        const ta = document.createElement('textarea');
        ta.value = currentText;
        ta.style.position = 'fixed';
        ta.style.opacity = '0';
        document.body.appendChild(ta);
        ta.select();
        document.execCommand('copy');
        ta.remove();
      }
      $('copy-label').textContent = 'Kopieret';
      $('copy-icon').setAttribute('href', '#i-check');
      copyTimer = setTimeout(resetCopyButton, 1800);
    });

    // --- Lommelygte ---
    // Ifølge W3C Image Capture-specifikationen er capabilities.torch en liste
    // ([true, false] når den kan styres); ældre Chrome-versioner returnerer blot true.
    function setupTorch() {
      const caps = videoTrack && videoTrack.getCapabilities ? videoTrack.getCapabilities() : {};
      const supported = caps.torch === true || (Array.isArray(caps.torch) && caps.torch.includes(true));
      torchBtn.classList.toggle('unsupported', !supported);
      torchBtn.dataset.supported = supported ? '1' : '';
      torchOn = false;
      torchBtn.setAttribute('aria-pressed', 'false');
    }
    torchBtn.addEventListener('click', async () => {
      if (!torchBtn.dataset.supported) {
        flashMessage('Lommelygte understøttes ikke her', false);
        return;
      }
      try {
        await videoTrack.applyConstraints({ advanced: [{ torch: !torchOn }] });
        torchOn = !torchOn;
        torchBtn.setAttribute('aria-pressed', String(torchOn));
      } catch (err) {
        console.error('[QR-scanner] Lommelygte-fejl', err);
        flashMessage('Lommelygten kunne ikke tændes');
      }
    });

    // --- Billede fra galleri ---
    const openGallery = () => fileInput.click();
    $('gallery-btn').addEventListener('click', openGallery);
    $('empty-gallery-btn').addEventListener('click', openGallery);

    fileInput.addEventListener('change', async () => {
      const file = fileInput.files[0];
      fileInput.value = '';            // så samme billede kan vælges igen
      if (!file) return;
      try {
        const bitmap = await createImageBitmap(file);
        const text = decodeImage(bitmap);
        bitmap.close && bitmap.close();
        if (text) {
          showResult(text, null);
        } else {
          showError('Ingen QR-kode fundet i billedet');
        }
      } catch (err) {
        console.error('[QR-scanner] Kunne ikke læse billedet', err);
        showError('Billedet kunne ikke åbnes');
      }
    });

    // Prøv et par størrelser — store fotos afkodes ofte bedre nedskaleret
    function decodeImage(bitmap) {
      for (const max of [1200, 800, 1800]) {
        const scale = Math.min(1, max / Math.max(bitmap.width, bitmap.height));
        const w = Math.round(bitmap.width * scale);
        const h = Math.round(bitmap.height * scale);
        const c = document.createElement('canvas');
        c.width = w;
        c.height = h;
        const ctx = c.getContext('2d', { willReadFrequently: true });
        ctx.drawImage(bitmap, 0, 0, w, h);
        const code = jsQR(ctx.getImageData(0, 0, w, h).data, w, h, { inversionAttempts: 'attemptBoth' });
        if (code && code.data) return code.data;
      }
      return null;
    }

    // Returnerer en sikker http(s)-adresse hvis HELE indholdet er et link, ellers null.
    // new URL() accepterer også fx "javascript:alert(1)", så protokollen tjekkes eksplicit —
    // ellers kunne en ondsindet QR-kode køre kode når man klikker på linket.
    function toSafeUrl(text) {
      let candidate = text.trim();
      if (/\s/.test(candidate)) return null;                  // mellemrum = tekst med et link i, ikke et link
      if (/^www\./i.test(candidate)) candidate = 'https://' + candidate;   // "www.dr.dk" uden protokol
      try {
        const url = new URL(candidate);
        if (url.protocol !== 'http:' && url.protocol !== 'https:') return null;
        return url.href;
      } catch {
        return null;                                          // kunne ikke tolkes som adresse
      }
    }

    // Byg DOM-elementer i stedet for innerHTML, så indholdet aldrig tolkes som HTML.
    // Returnerer et klikbart link hvis indholdet er en sikker adresse, ellers en tekst-node.
    function createContentNode(text) {
      const url = toSafeUrl(text);
      if (!url) return document.createTextNode(text);
      const a = document.createElement('a');
      a.href = url;
      a.textContent = text.trim();   // vis adressen som den stod i koden (ikke %-kodet)
      a.target = '_blank';
      a.rel = 'noopener noreferrer';
      return a;
    }

    // --- Historik (localStorage) ---
    // Adgang til localStorage kan kaste fejl (fx blokeret af browserindstillinger eller
    // fuld lagerplads), så al læsning/skrivning er pakket ind i try/catch.

    function loadHistory() {
      try {
        const data = JSON.parse(localStorage.getItem(HISTORY_KEY));
        return Array.isArray(data) ? data.filter(e => e && typeof e.text === 'string') : [];
      } catch (err) {
        console.warn('[QR-scanner] Kunne ikke læse historik', err);
        return [];
      }
    }

    function saveHistory(history) {
      try {
        localStorage.setItem(HISTORY_KEY, JSON.stringify(history));
      } catch (err) {
        console.warn('[QR-scanner] Kunne ikke gemme historik', err);
        flashMessage('Historikken kunne ikke gemmes');
      }
    }

    // Nyeste først. Scannes en kode der allerede er i listen, flyttes den øverst
    // med nyt tidspunkt i stedet for at blive dubleret.
    function addToHistory(text) {
      const history = loadHistory().filter(e => e.text !== text);
      history.unshift({ text, time: Date.now() });
      saveHistory(history.slice(0, HISTORY_MAX));
      renderHistory();
    }

    function deleteFromHistory(time) {
      saveHistory(loadHistory().filter(e => e.time !== time));
      renderHistory();
    }

    function formatTime(ms) {
      return new Date(ms).toLocaleString('da-DK', { dateStyle: 'short', timeStyle: 'short' });
    }

    function icon(id) {
      const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
      svg.setAttribute('class', 'icon');
      const use = document.createElementNS('http://www.w3.org/2000/svg', 'use');
      use.setAttribute('href', '#' + id);
      svg.appendChild(use);
      return svg;
    }

    function renderHistory() {
      const history = loadHistory();
      historyList.replaceChildren();
      historyEmpty.style.display = history.length ? 'none' : 'block';
      clearHistoryBtn.style.visibility = history.length ? 'visible' : 'hidden';

      for (const entry of history) {
        const li = document.createElement('li');
        li.className = 'history-item';

        const kind = document.createElement('div');
        kind.className = 'history-kind';
        kind.appendChild(icon(toSafeUrl(entry.text) ? 'i-link' : 'i-text'));

        const body = document.createElement('div');
        body.className = 'history-body';
        const content = document.createElement('div');
        content.className = 'history-content';
        content.appendChild(createContentNode(entry.text));
        const time = document.createElement('div');
        time.className = 'history-time';
        time.textContent = formatTime(entry.time);
        body.append(content, time);

        const del = document.createElement('button');
        del.className = 'icon-btn history-delete';
        del.setAttribute('aria-label', 'Slet fra historik');
        del.appendChild(icon('i-x'));
        del.addEventListener('click', () => deleteFromHistory(entry.time));

        li.append(kind, body, del);
        historyList.appendChild(li);
      }
    }

    // "Ryd" kræver to tryk i stedet for en pop-up-bekræftelse
    let clearArmed = false, clearTimer = null;
    function disarmClear() {
      clearArmed = false;
      clearHistoryBtn.textContent = 'Ryd';
      clearHistoryBtn.classList.remove('confirm');
    }
    clearHistoryBtn.addEventListener('click', () => {
      if (!clearArmed) {
        clearArmed = true;
        clearHistoryBtn.textContent = 'Tryk igen for at rydde';
        clearHistoryBtn.classList.add('confirm');
        clearTimer = setTimeout(disarmClear, 3000);
        return;
      }
      clearTimeout(clearTimer);
      disarmClear();
      saveHistory([]);
      lastResult = null;   // så den senest scannede kode kan tilføjes igen
      renderHistory();
    });

    // Scanningen genoptages først når intet kort er åbent
    function resumeIfIdle() {
      const anyOpen = document.querySelector('.sheet.open');
      if (!anyOpen) setTimeout(() => { if (!document.querySelector('.sheet.open')) paused = false; }, 300);
    }

    $('history-btn').addEventListener('click', () => {
      paused = true;
      disarmClear();
      renderHistory();
      closeCreate();
      openSheet(historySheet);
    });
    $('close-history-btn').addEventListener('click', () => {
      closeSheet(historySheet);
      resumeIfIdle();
    });

    // --- Opret QR-kode ---
    const createSheet = $('create-sheet');
    const createInput = $('create-input');
    const qrCard = $('qr-card');
    const qrCanvas = $('qr-canvas');
    const QR_MAX_BYTES = 2331;       // maks. bytes ved fejlkorrektion 'M' (målt mod biblioteket)
    const QR_EXPORT_PX = 1024;       // ca. størrelse på det gemte/delte billede
    let qrFile = null;               // færdig PNG, klar til deling (se kommentar i renderQr)
    let qrRenderTimer = null;

    // Standard i qrcode-generator er charCode & 0xff, som ødelægger fx emoji —
    // biblioteket har en UTF-8-funktion, men den skal slås til eksplicit.
    qrcode.stringToBytes = qrcode.stringToBytesFuncs['UTF-8'];

    // Web Share med filer: Chrome Android, iOS/macOS Safari 14+, Chrome på Windows/ChromeOS.
    // Ikke Firefox — der vises kun "Gem billede".
    const canShareFiles = (() => {
      try {
        return !!(navigator.canShare && navigator.canShare({ files: [new File([''], 'test.png', { type: 'image/png' })] }));
      } catch { return false; }
    })();
    $('share-btn').hidden = !canShareFiles;
    $('save-btn').className = 'btn ' + (canShareFiles ? 'secondary' : 'primary');

    function utf8Length(text) { return new TextEncoder().encode(text).length; }

    function setQrEmpty(message, tooLong = false) {
      qrCard.classList.add('empty');
      qrCard.classList.toggle('too-long', tooLong);
      $('qr-placeholder-text').textContent = message;
      qrFile = null;
      $('share-btn').disabled = true;
      $('save-btn').disabled = true;
    }

    function renderQr() {
      const text = createInput.value;
      const bytes = utf8Length(text);
      const url = text.trim() ? toSafeUrl(text) : null;

      $('create-kind').replaceChildren();
      if (text.trim()) $('create-kind').append(icon(url ? 'i-link' : 'i-text'), url ? 'Link' : 'Tekst');
      const countEl = $('create-count');
      countEl.textContent = bytes > QR_MAX_BYTES * 0.8 ? bytes + ' / ' + QR_MAX_BYTES : '';
      countEl.classList.toggle('over', bytes > QR_MAX_BYTES);

      if (!text.trim()) return setQrEmpty('Din QR-kode vises her');
      if (bytes > QR_MAX_BYTES) return setQrEmpty('Teksten er for lang til en QR-kode', true);

      let qr;
      try {
        qr = qrcode(0, 'M');           // 0 = vælg størrelse automatisk
        qr.addData(text);
        qr.make();
      } catch (err) {
        // Biblioteket kaster en tekststreng (ikke Error) ved "code length overflow"
        console.warn('[QR-scanner] Kunne ikke generere QR-kode', err);
        return setQrEmpty('Teksten er for lang til en QR-kode', true);
      }

      // Tegn med hele pixels pr. modul og 4 modulers hvid kant (kræves af QR-standarden)
      const n = qr.getModuleCount();
      const margin = 4;
      const cell = Math.max(4, Math.floor(QR_EXPORT_PX / (n + margin * 2)));
      const size = (n + margin * 2) * cell;
      qrCanvas.width = qrCanvas.height = size;
      const ctx = qrCanvas.getContext('2d');
      ctx.fillStyle = '#fff';
      ctx.fillRect(0, 0, size, size);
      ctx.fillStyle = '#000';
      for (let r = 0; r < n; r++) {
        for (let c = 0; c < n; c++) {
          if (qr.isDark(r, c)) ctx.fillRect((c + margin) * cell, (r + margin) * cell, cell, cell);
        }
      }
      qrCard.classList.remove('empty', 'too-long');

      // PNG'en laves med det samme (ikke først ved tryk), fordi Safari kræver at
      // navigator.share() kaldes direkte i trykket — uden asynkron ventetid først.
      const renderedText = text;
      qrCanvas.toBlob(blob => {
        if (!blob || createInput.value !== renderedText) return;
        qrFile = new File([blob], 'qr-kode.png', { type: 'image/png' });
        $('share-btn').disabled = false;
        $('save-btn').disabled = false;
      }, 'image/png');
    }

    createInput.addEventListener('input', () => {
      $('share-btn').disabled = true;
      $('save-btn').disabled = true;
      clearTimeout(qrRenderTimer);
      qrRenderTimer = setTimeout(renderQr, 150);
    });

    function openCreate() {
      paused = true;
      closeSheet(historySheet);
      if (resultSheet.classList.contains('open')) rescan();
      paused = true;
      document.body.classList.add('create-open');
      openSheet(createSheet);
      createInput.focus({ preventScroll: true });   // direkte i trykket, så iOS viser tastaturet
    }
    function closeCreate() {
      if (!createSheet.classList.contains('open')) return;
      createInput.blur();
      closeSheet(createSheet);
      document.body.classList.remove('create-open');
      resumeIfIdle();
    }

    $('mode-create').addEventListener('click', openCreate);
    $('mode-scan').addEventListener('click', closeCreate);
    $('close-create-btn').addEventListener('click', closeCreate);
    $('empty-create-btn').addEventListener('click', openCreate);

    $('share-btn').addEventListener('click', async () => {
      if (!qrFile) return;
      const text = createInput.value.trim();
      try {
        await navigator.share({ files: [qrFile], title: 'QR-kode', text: text.length <= 200 ? text : undefined });
      } catch (err) {
        if (err.name !== 'AbortError') {   // AbortError = brugeren lukkede delingsmenuen
          console.error('[QR-scanner] Deling fejlede', err);
          flashMessage('Kunne ikke dele billedet');
        }
      }
    });

    let saveTimer = null;
    $('save-btn').addEventListener('click', () => {
      if (!qrFile) return;
      const a = document.createElement('a');
      a.href = URL.createObjectURL(qrFile);
      a.download = 'qr-kode.png';
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(() => URL.revokeObjectURL(a.href), 10000);
      $('save-label').textContent = 'Gemt';
      $('save-icon').setAttribute('href', '#i-check');
      clearTimeout(saveTimer);
      saveTimer = setTimeout(() => {
        $('save-label').textContent = 'Gem billede';
        $('save-icon').setAttribute('href', '#i-download');
      }, 1800);
    });

    // Escape lukker det øverste kort (praktisk på computer)
    document.addEventListener('keydown', e => {
      if (e.key !== 'Escape') return;
      if (createSheet.classList.contains('open')) closeCreate();
      else if (historySheet.classList.contains('open')) $('close-history-btn').click();
      else if (resultSheet.classList.contains('open')) rescan();
    });

    $('permission-btn').addEventListener('click', startCamera);

    // Service worker: gør appen installerbar og giver offline-adgang.
    // Relativ sti, så den virker under /QR-scanner/ på GitHub Pages.
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('service-worker.js')
        .then(reg => console.log('[QR-scanner] Service worker registreret, scope:', reg.scope))
        .catch(err => console.error('[QR-scanner] Service worker fejlede', err));
    }

    renderHistory();
    // Start kameraet med det samme, som i en kamera-app. Afviser man, vises tomt-skærmbilledet.
    startCamera();
  </script>
</body>
</html>
